name: StudioRecorder

# The bundle id prefix lives only here, so renaming the project is a one line change.
options:
  bundleIdPrefix: io.github.creatorstudio
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing: no Apple developer account or team is needed.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    # No App Sandbox on purpose: the app writes takes straight into the
    # workspace folder chosen by ./studio setup.
    ENABLE_APP_SANDBOX: NO

targets:
  StudioRecorder:
    type: application
    platform: macOS
    sources:
      - path: Sources
    entitlements:
      path: Sources/StudioRecorder.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Studio Recorder
        CFBundleDisplayName: Studio Recorder
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.video
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: Studio Recorder records your voice into your takes.
        NSSpeechRecognitionUsageDescription: Studio Recorder listens to you read your script so the teleprompter can follow your voice.
        NSCameraUsageDescription: Studio Recorder records your camera into your takes.
        # Tells the Studio app that this recorder understands handoff/v1 files.
        CSHandoff: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.creatorstudio.recorder
        PRODUCT_NAME: Studio Recorder
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        COMBINE_HIDPI_IMAGES: YES

  RecorderTests:
    type: bundle.unit-test
    platform: macOS
    # Only the pure files are compiled in: no camera, no screen, no GPU.
    sources:
      - path: Tests
      - path: Sources/Core
      - path: Sources/TeleprompterScript.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.creatorstudio.recorder.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
